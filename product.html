<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product | Shubharambh</title>
  <meta name="description" content="Shubharambh product details: what Indian households are missing, what Shubharambh brings, and how ICAR-NISA verifies purity.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700&family=Playfair+Display:wght@600;700&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" href="assets/img/brand/favicon.svg" type="image/svg+xml">
  <style>
    .pd-nav { position: sticky; top: 72px; z-index: 20; background: var(--cream); border-bottom: 2px solid var(--line); margin-top: 10px; }
    .pd-nav .tab-bar { border-bottom: 0; }
    .pd-nav a { text-decoration: none; padding: 12px 16px; font-weight: 600; color: var(--ink-soft); white-space: nowrap; border-bottom: 3px solid transparent; display: inline-block; }
    .pd-nav a:hover, .pd-nav a.active { color: var(--maroon); border-bottom-color: var(--saffron); }
    .pd-section { padding: 38px 0 6px; scroll-margin-top: 130px; }
    .pd-section > h2 { font-size: 1.6rem; }
    .modal { position: fixed; inset: 0; background: rgba(20, 10, 5, .7); z-index: 130; display: none; align-items: center; justify-content: center; padding: 16px; }
    .modal.open { display: flex; }
    .modal-box { background: #fff; border-radius: 16px; max-width: 760px; width: 100%; max-height: 92vh; overflow: auto; position: relative; }
    .modal-close { position: absolute; top: 10px; right: 10px; width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--cream); font-size: 1.3rem; cursor: pointer; z-index: 2; }
    .certdoc { margin: 18px; border: 6px double var(--tulsi); padding: 26px; position: relative; overflow: hidden; background: linear-gradient(#fffdf6, #f6fbf3); }
    .certdoc::after { content: "SAMPLE · PLACEHOLDER"; position: absolute; inset: 0; display: grid; place-items: center; font: 700 2.4rem var(--font-body); color: rgba(179, 38, 30, .12); transform: rotate(-24deg); pointer-events: none; letter-spacing: .1em; }
    .certdoc h3 { text-align: center; color: var(--tulsi); margin: 6px 0 2px; }
    .certdoc .ct-sub { text-align: center; font-size: .85rem; color: var(--muted); margin-bottom: 16px; }
    .certdoc table { width: 100%; border-collapse: collapse; font-size: .88rem; }
    .certdoc td, .certdoc th { border: 1px solid var(--line); padding: 6px 8px; text-align: left; }
    .certdoc th { background: var(--tulsi-soft); }
    .pd-hero-meta { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .86rem; color: var(--muted); margin: 6px 0 4px; }
  </style>
</head>
<body data-page="product">
  <div id="site-header"></div>

  <main id="main">
    <div class="wrap" id="pd-root">
      <div class="empty-state" style="margin:60px 0">Loading product…</div>
    </div>
    <section class="block tight block-paper" id="related-wrap">
      <div class="wrap">
        <div class="section-head" style="margin-bottom:20px"><span class="eyebrow">You may also like</span><h2 style="margin:0" id="related-title">More from this category</h2></div>
        <div class="products-grid" id="related"></div>
      </div>
    </section>
  </main>

  <div class="lightbox" id="lightbox" role="dialog" aria-label="Image viewer"><button type="button" aria-label="Close">✕</button><img alt=""></div>
  <div class="modal" id="cert-modal" role="dialog" aria-modal="true" aria-label="Sample certificate"><div class="modal-box"><button class="modal-close" type="button" aria-label="Close">✕</button><div id="cert-body"></div></div></div>

  <div id="site-footer"></div>

  <script src="assets/js/data-organic.js"></script>
  <script src="assets/js/data-honey.js"></script>
  <script src="assets/js/data-crafts.js"></script>
  <script src="assets/js/images.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/pages/product.js"></script>
</body>
</html>
